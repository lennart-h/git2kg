[build-system]
# 77 is where setuptools understands `license` as an SPDX expression
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "git2kg"
version = "1.0.0"
authors = [
    {name = "Lennart Hessenauer", email = "lennart.hessenauer@uni-wuerzburg.de"},
    {name = "Lisi Qarkaxhija", email = "lisi.qarkaxhija@uni-wuerzburg.de"},
    {name = "Ingo Scholtes", email = "ingo.scholtes@uni-wuerzburg.de"}
]
description= "An OpenSource package to extract knowledge graphs from GitHub Repositories"
readme = "README.md"
# AGPL because `gambit` is embedded and called from the core pipeline, see the
# note at the top of src/git2kg/gambit.py
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = [
    "knowledge-graph",
    "network",
    "gnn",
    "mining",
    "snapshot",
    "github",
    "git",
    "graph"
]

requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0.0,<2.8",
    "pandas>=2.2.2,<3.0",
    "PyDriller==2.1",
    # Pinned although it arrives through PyDriller: it computes the source
    # metrics of every file version, so an unpinned version makes those
    # features depend on the machine a repository is mined on. 1.24.2 also
    # raises on some TypeScript sources, where 1.22.1 does not
    "lizard==1.22.1",
    "PyGithub>=2.9.0",
    "pyjarowinkler>=1.8",
    "python_Levenshtein>=0.27.1",
    "textblob>=0.19.0",
    "tqdm>=4.66.5",
    "Unidecode>=1.3.8",
]

[project.optional-dependencies]
pyg = ["torch>=2.2.2", "torch_geometric>=2.6.1"]
pathpy = ["pathpyG@git+https://github.com/pathpy/pathpyG.git@8b1c2f475a06b2ddcffc4b3ff7f36512cea757a7"]
networkx = ["networkx>=3.3"]
all = ["git2kg[pyg,pathpy,networkx]"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
# Ships the py.typed marker, so installed copies are seen as typed
git2kg = ["py.typed"]

[dependency-groups]
dev = [
    "coverage>=7.15.3",
    "graphql-core>=3.3.0",
    "mypy>=2.3.1",
    "networkx-stubs>=0.0.1",
    "pandas-stubs>=2.3.3.260113",
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
    "types-tqdm>=4.68.0.20260608",
]

[tool.mypy]
files = ["src"]
python_version = "3.12"
check_untyped_defs = true
# Vendored, not ours to annotate
exclude = ["gambit\\.py$"]

# Third-party packages without type information
[[tool.mypy.overrides]]
module = ["pydriller.*", "textblob.*", "pyjarowinkler.*", "Levenshtein.*", "unidecode.*"]
ignore_missing_imports = true

# Tests are not type checked. `files` above already scopes CLI runs to src/;
# this keeps editors that check the open file from reporting on tests
[[tool.mypy.overrides]]
module = "test.*"
ignore_errors = true

[tool.ruff]
target-version = "py311"
extend-exclude = ["*.ipynb"]
exclude = ["gambit.py"]

[tool.ruff.lint]
# pyflakes basics (F), bugbear (B - catches mutable default arguments
# etc.), import sorting (I), and pycodestyle comparison checks (E7). Not
# the full E family: E501 (line length) is a formatting concern, and E1-E4
# currently have zero findings in this codebase anyway.
select = ["E7", "F", "B", "I"]

